<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#302b63" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Ishani - Multiplayer: Beautiful offline 2-player mini games. Play vs Friend or Bot." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Ishani - Multiplayer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="splash">
    <div class="splash-bg">
      <div class="splash-orb splash-orb-1"></div>
      <div class="splash-orb splash-orb-2"></div>
      <div class="splash-orb splash-orb-3"></div>
    </div>
    <div class="splash-content">
      <div class="splash-logo">
        <div class="splash-ring"></div>
        <div class="splash-core">I</div>
      </div>
      <h1 class="splash-title">Ishani</h1>
      <p class="splash-sub">Multiplayer</p>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
      <p class="splash-tag">16 Games · Offline · 2 Players</p>
    </div>
  </div>

  <div id="app">
    <section id="home" class="screen active">
      <header class="hero">
        <div class="logo-wrap">
          <div class="logo-orb"></div>
          <h1>Ishani</h1>
          <p class="tagline">Multiplayer · Offline · Beautiful</p>
        </div>
        <div class="stats-bar">
          <span id="games-count">16 Games</span>
          <span class="dot">•</span>
          <span>2 Players</span>
          <span class="dot">•</span>
          <span>vs Bot</span>
        </div>
      </header>
      <div class="search-row">
        <input type="search" id="search-games" placeholder="Search games..." autocomplete="off" />
      </div>
      <div class="games-grid" id="games-grid"></div>
      <footer class="home-footer">
        <p>Made with ♥ · Fully Offline</p>
      </footer>
    </section>

    <section id="detail" class="screen">
      <button class="back-btn" id="detail-back" aria-label="Back">←</button>
      <div class="detail-hero" id="detail-hero">
        <div class="detail-art" id="detail-art"></div>
        <h2 id="detail-title"></h2>
        <p id="detail-desc"></p>
        <div class="detail-meta" id="detail-meta"></div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-friend" id="btn-friend">
          <span class="btn-icon">👥</span>
          <span>Play vs Friend</span>
        </button>
        <button class="btn btn-bot" id="btn-bot">
          <span class="btn-icon">🤖</span>
          <span>Play vs Bot</span>
        </button>
      </div>
    </section>

    <section id="play" class="screen">
      <div class="play-header">
        <button class="back-btn" id="play-back" aria-label="Back">←</button>
        <h2 id="play-title"></h2>
        <button class="icon-btn" id="btn-restart" title="Restart">↻</button>
      </div>
      <div class="teams-bar">
        <div class="team red" id="team-red">
          <div class="team-color"></div>
          <div class="team-info">
            <span class="team-name" id="red-name">Red</span>
            <span class="team-score" id="red-score">0</span>
          </div>
          <div class="turn-dot" id="red-turn"></div>
        </div>
        <div class="vs-label">VS</div>
        <div class="team blue" id="team-blue">
          <div class="turn-dot" id="blue-turn"></div>
          <div class="team-info">
            <span class="team-name" id="blue-name">Blue</span>
            <span class="team-score" id="blue-score">0</span>
          </div>
          <div class="team-color"></div>
        </div>
      </div>
      <div class="turn-banner" id="turn-banner">
        <span id="turn-text">Red's Turn</span>
      </div>
      <div class="game-stage" id="game-stage"></div>
      <div class="play-footer" id="play-footer"></div>
    </section>

    <div id="result-modal" class="modal hidden">
      <div class="modal-card">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <h3 id="result-title">Winner!</h3>
        <p id="result-msg"></p>
        <div class="modal-actions">
          <button class="btn btn-friend" id="result-rematch">Rematch</button>
          <button class="btn btn-ghost" id="result-home">Home</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/games-data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/games/connect4.js"></script>
  <script src="js/games/rps.js"></script>
  <script src="js/games/dots.js"></script>
  <script src="js/games/checkers.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/pong.js"></script>
  <script src="js/games/airhockey.js"></script>
  <script src="js/games/battleship.js"></script>
  <script src="js/games/carrom.js"></script>
  <script src="js/games/ludo.js"></script>
  <script src="js/games/snakesladders.js"></script>
  <script src="js/games/simon.js"></script>
  <script src="js/games/hangman.js"></script>
  <script src="js/games/react.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
